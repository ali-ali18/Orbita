# Sobe tudo na VPS: docker compose up -d
# Parear o celular: docker compose exec api parear

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: orbita
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    working_dir: /app/packages/db
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment: &app-env
      DATABASE_URL: postgresql://orbita:${POSTGRES_PASSWORD}@postgres:5432/orbita
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no .env}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ["node", "--import", "tsx", "src/index.ts"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api

volumes:
  postgres:
  redis:
  caddy:
