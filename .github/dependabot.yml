version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node só nas linhas LTS (pares): ignora 23, 25 e os seguintes; o 24 (LTS) continua liberado.
      - dependency-name: "node"
        versions: [">=23 <24", ">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
