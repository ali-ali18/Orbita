name: App Android

# Constrói o APK do app (Expo, sem EAS).
# - Pull request que mexe no app: só compila (prova que builda) e guarda o APK como artefato.
#   Sem release e sem segredos.
# - main (CI verde) ou disparo manual na main: constrói, assina e publica um GitHub Release marcado
#   como "latest". O link estável https://github.com/ali-ali18/Orbita/releases/latest/download/orbita.apk
#   serve sempre o APK mais novo. Veja docs/app-android.md.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/tokens/**"
      - "packages/core/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-android.yml"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um build por vez por ref: a ordem dos runs define o versionCode. PR velho é cancelado;
# na main nunca cancelamos um build em andamento.
concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mesmas condições do release.yml. Só publica em dois casos:
  # (a) CI concluído com sucesso (conclusion), disparado por push (event) e não por pull_request,
  #     no branch main (head_branch) do PRÓPRIO repositório (head_repository). `branches: [main]`
  #     sozinho também casa um PR de fork cujo branch se chama "main".
  # (b) disparo manual, mas só a partir da main (ref).
  PUBLICAR: >-
    ${{ (github.event_name == 'workflow_run'
    && github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.event == 'push'
    && github.event.workflow_run.head_branch == 'main'
    && github.event.workflow_run.head_repository.full_name == github.repository)
    || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  apk:
    name: Construir APK
    # PR sempre constrói; fora isso, só nos dois casos de publicação (mesma condição do env.PUBLICAR no topo;
    # o contexto `env` não existe em `jobs.<id>.if`, por isso a repetição).
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versao.outputs.version }}
      short: ${{ steps.versao.outputs.short }}
    env:
      # Arquiteturas nativas do APK. Só arm64 (todo celular moderno): build bem mais rápido e APK menor.
      # Para incluir aparelhos de 32 bits: "armeabi-v7a,arm64-v8a".
      ORBITA_ARCHS: arm64-v8a
      # Soma ao run_number para o versionCode nunca regredir se este workflow for renomeado/recriado.
      ORBITA_VERSION_CODE_OFFSET: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          # O commit exato que o CI aprovou, não o que estiver na ponta da main agora.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # RN 0.88 / Expo SDK 58 / Gradle 9.4: JDK 17 (mínimo do AGP e do Gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Versões que o React Native 0.88 pede (react-native/gradle/libs.versions.toml):
      # compileSdk 37, build-tools 37.0.0, NDK 27.1.12297006. O setup-android também aceita as licenças.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Definir versão
        id: versao
        run: |
          base="$(node -p "require('./apps/mobile/app.json').expo.version")"
          short="$(git rev-parse --short=7 HEAD)"
          code=$(( ORBITA_VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          {
            echo "ORBITA_VERSION_CODE=$code"
            echo "ORBITA_VERSION_SUFFIX=+$short"
          } >> "$GITHUB_ENV"
          {
            echo "version=$base"
            echo "short=$short"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Versão $base+$short (versionCode $code)"

      - name: Preparar chave de assinatura
        if: env.PUBLICAR == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbita-release.keystore"
            chmod 600 "$RUNNER_TEMP/orbita-release.keystore"
            # Só o caminho vai para o ambiente dos próximos passos; as senhas entram direto no passo do Gradle.
            echo "ORBITA_KEYSTORE_FILE=$RUNNER_TEMP/orbita-release.keystore" >> "$GITHUB_ENV"
            echo "Assinando com a chave própria (segredos ANDROID_*)."
          else
            echo "::warning::Segredos ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD ausentes: assinando com o keystore de debug do template do Expo. Funciona e atualiza por cima, mas qualquer um pode assinar um APK com a mesma chave. Veja docs/app-android.md para trocar por uma chave privada."
          fi

      - name: Gerar projeto Android (expo prebuild)
        run: pnpm --filter @orbita/mobile exec expo prebuild --platform android --no-install --clean

      - name: Compilar APK de release
        working-directory: apps/mobile/android
        env:
          ORBITA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBITA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBITA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # PR não recebe chave própria: sem ORBITA_KEYSTORE_FILE o plugin usa o keystore do template.
          if [ "$PUBLICAR" != "true" ]; then
            unset ORBITA_KEYSTORE_PASSWORD ORBITA_KEY_ALIAS ORBITA_KEY_PASSWORD
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures="$ORBITA_ARCHS" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      - name: Conferir assinatura e nomear o APK
        run: |
          src="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src"
          mkdir -p dist
          cp "$src" dist/orbita.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/orbita.apk \
            | grep -E "certificate (DN|SHA-256)" | sed 's/^/  /'
          ls -l dist/orbita.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbita-apk
          path: dist/orbita.apk
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar release
    needs: apk
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Só este job escreve: cria a tag e o GitHub Release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbita-apk
          path: dist
      - name: Criar release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.apk.outputs.version }}
          SHORT: ${{ needs.apk.outputs.short }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="app-v${VERSION}-${GITHUB_RUN_NUMBER}"
          title="Órbita para Android · ${VERSION} (#${GITHUB_RUN_NUMBER})"
          {
            echo "APK da Órbita para Android, versão ${VERSION}, compilação #${GITHUB_RUN_NUMBER}, commit \`${SHORT}\`."
            echo
            echo "## Como instalar"
            echo
            echo "1. No celular, abra o link fixo: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/orbita.apk"
            echo "2. Baixe e abra o arquivo. Se o Android pedir, permita **instalar apps desconhecidos** para o navegador."
            echo "3. Toque em **Instalar**. Se já tiver a Órbita, ela é atualizada por cima e seus dados ficam."
            echo
            echo "Mais detalhes em [docs/app-android.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/app-android.md)."
          } > "$RUNNER_TEMP/notas.md"
          gh release create "$tag" dist/orbita.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notas.md" \
            --latest
